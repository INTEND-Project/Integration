name: Validate InSustain Chart

on:
  pull_request:
    paths:
      - 'k8s-deployments/insustain/**'
      - '.github/workflows/insustain-chart.yaml'
  push:
    branches: [main]
    paths:
      - 'k8s-deployments/insustain/**'
      - '.github/workflows/insustain-chart.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: 'v4.3.2'
      - name: Lint chart
        run: helm lint k8s-deployments/insustain/application
      - name: Test rendered configurations
        run: python3 -m unittest discover -s k8s-deployments/insustain/tests -v
