    # sparql.sparql.endpoint; default "http://fuseki:3030/intent/"; chart: external.fuseki
    SPARQL_ENDPOINT: ~
    # sparql.instance-graph; default "https://github.com/INTEND-Project/inNet/blob/main/doc/inNet-intent-instances.ttl"
    SPARQL_INSTANCE_GRAPH: ~
    # sparql.ontology-graph; default "https://github.com/INTEND-Project/inNet/blob/main/doc/inNet-intent-ontology.ttl"
    SPARQL_ONTOLOGY_GRAPH: ~
    # sparql.credentials.password; default "admin"; chart: Secret FUSEKI_ADMIN_PASSWORD
    SPARQL_PASSWORD: ~
    # sparql.update.endpoint; default "http://fuseki:3030/intent/update"; chart: external.fuseki
    SPARQL_UPDATE_ENDPOINT: ~
    # sparql.credentials.user; default "admin"; chart: external.fuseki.username
    SPARQL_USER: ~
    # spring.datasource.driverClassName; default "org.h2.Driver"
    SPRING_DATASOURCE_DRIVER: ~
