  env:
    # kafka.agent-timeouts.3GPP_NSMF (reply timeout of the NSMF agent); default none
    KAFKA_AGENT_TIMEOUTS_3GPP_NSMF: "120000"
    # spring.kafka.bootstrap-servers; default none; chart: external.kafka.bootstrapServers
    KAFKA_BOOTSTRAP_SERVERS: ~
    # kafka.agent-timeouts.SOCCER; default "900000"
    KAFKA_SOCCER_TIMEOUT_MS: ~
    # kafka.timeout (@Value); default "10000"
    KAFKA_TIMEOUT: ~
    # spring.kafka.group-id (@Value); default "operation-management"
    SPRING_KAFKA_GROUP_ID: ~
    # kafka.topics.response; default none; chart: topics.response
    TASK_RESPONSE_TOPIC: ~
    # kafka.topics.command; default none; chart: topics.task
    TASK_TOPIC: ~
  extraEnv: []

gui:
  enabled: true
  image:
    repository: intent-manager-gui
    tag: ""
  replicas: 1
  resources: {}
  env:
    # env.js (not loaded by the image's index.html); default empty
    BE_URL: ~
    # nginx upstream; default "fuseki:3030"; chart: external.fuseki host (full name if it has no dot):port
    FUSEKI_UPSTREAM: ~
    # env.js (not loaded by the image's index.html); default empty
    FUSEKI_URL: ~
    # env.js (not loaded by the image's index.html); default empty
    GRAPH_URI: "https://github.com/INTEND-Project/inNet/blob/main/doc/inNet-intent-instances.ttl"
    # nginx upstream; default "intent-lcm-backend:8080"; chart: <namePrefix>-intent-lcm.<namespace>.svc.<clusterDomain>:8080
    INTENT_LCM_UPSTREAM: ~
    # nginx upstream; default "intent-translator:8080"; chart: <namePrefix>-intent-lcm.<namespace>.svc.<clusterDomain>:8082
    INTENT_TRANSLATOR_UPSTREAM: ~
    # env.js (not loaded by the image's index.html); default empty
    INTERPRETER_URL: ~
    # nginx upstream; default "operation-management:8080"; chart: <namePrefix>-operation-management.<namespace>.svc.<clusterDomain>:8080
    OPERATION_MANAGEMENT_UPSTREAM: ~
    # env.js (not loaded by the image's index.html); default "/operation-management"; chart: /operation-management
    OPERATION_MANAGER_URL: ~
  extraEnv: []
  # The GUI image's nginx template has "resolver 127.0.0.11" (the Docker DNS), which does not exist on
  # Kubernetes, so the proxies to intent-lcm and Fuseki would fail. An init container copies the image's
  # template and replaces only that line: "auto" = the pod's DNS server (/etc/resolv.conf), an IP = that
  # server, "" = keep the image's template unchanged (e.g. once the image makes the resolver configurable).
  nginxResolver: auto

# Agents (plugins/*): choose which ones are deployed with "enabled".
agents:
  nsmf:                             # plugins/3gpp-nsmf-agent (compose service nsmf-plugin)
    enabled: true
    image:
      repository: 3gpp-nsmf-agent
      tag: ""
    resources: {}
    env:
      # agent.nsmf.terminate-ready-poll-seconds (@Value); default "5"
      AGENT_NSMF_TERMINATE_READY_POLL_SECONDS: ~
      # agent.nsmf.terminate-ready-timeout-seconds (@Value); default "180"
      AGENT_NSMF_TERMINATE_READY_TIMEOUT_SECONDS: ~
      # spring.kafka.bootstrap-servers; default none; chart: external.kafka.bootstrapServers
      KAFKA_BOOTSTRAP_SERVERS: ~
      # agent.nsmf.base-url; default "http://nsmf:8080"; chart: external.nsmf.baseUrl
      NSMF_BASE_URL: ~
      # agent.nsmf.catalogue-path; default "/ns/catalogue/nstemplate"
      NSMF_CATALOGUE_PATH: "/ns/catalogue/nstemplate"
      # agent.nsmf.create-nsi-path; default "/vs/basic/nslcm/ns/nst"
      NSMF_CREATE_NSI_PATH: "/vs/basic/nslcm/ns/nst"
      # agent.nsmf.instantiate-path-template; default "/vs/basic/nslcm/ns/%s/action/instantiate"
      NSMF_INSTANTIATE_TEMPLATE: "/vs/basic/nslcm/ns/%s/action/instantiate"
      # agent.nsmf.ns-list-path; default "/vs/basic/nslcm/ns"
      NSMF_NS_LIST_PATH: ~
      # agent.nsmf.terminate-path-template; default "/vs/basic/nslcm/ns/%s/action/terminate"
      NSMF_TERMINATE_TEMPLATE: "/vs/basic/nslcm/ns/%s/action/terminate"
      # agent.sleep; default none
      SLEEP: "5"
      # spring.kafka.group-id (@Value); default "operation-management"
      SPRING_KAFKA_GROUP_ID: ~
      # kafka.topics.response; default none; chart: topics.response
      TASK_RESPONSE_TOPIC: ~
      # kafka.topics.command; default none; chart: topics.task
      TASK_TOPIC: ~
    extraEnv: []
  soccer:                           # plugins/soccer-agent
    enabled: true
    image:
      repository: soccer-agent
      tag: ""
    resources: {}
    env:
      # spring.kafka.bootstrap-servers; default none; chart: external.kafka.bootstrapServers
      KAFKA_BOOTSTRAP_SERVERS: ~
      # agent.workers; default "4"
      SOCCER_AGENT_WORKERS: ~
      # soccer.base-url; default "http://soccer-mock:9090"; chart: external.soccer.baseUrl
      SOCCER_BASE_URL: ~
      # soccer.catalogue-base-url; default empty
      SOCCER_CATALOGUE_BASE_URL: ~
      # soccer.delete-service-instance-after-terminate; default "true"
      SOCCER_DELETE_SERVICE_INSTANCE_AFTER_TERMINATE: "false"
      # soccer.instantiate-timeout-seconds; default "600"
      SOCCER_INSTANTIATE_TIMEOUT_SECONDS: ~
      # soccer.poll-interval-seconds; default "5"
      SOCCER_POLL_INTERVAL_SECONDS: ~
      # soccer.tenant-id; default empty; chart: external.soccer.tenantId
      SOCCER_TENANT_ID: ~
      # kafka.topics.response; default none; chart: topics.response
      TASK_RESPONSE_TOPIC: ~
      # kafka.topics.command; default none; chart: topics.task
      TASK_TOPIC: ~
    extraEnv: []

# Loads the intent ontologies into Fuseki (compose fuseki-intent-dataset-init). Runs as the last init container
# of intent-lcm, so the LCM starts only after it succeeded, as in compose. The loader is idempotent (creates the
# dataset if missing, replaces each graph), so it also runs safely on every intent-lcm restart.
ontologyInit:
  enabled: true
  image:
    repository: ontology-init
    tag: ""
  env:
    # loader; default "admin"; chart: Secret FUSEKI_ADMIN_PASSWORD
    FUSEKI_ADMIN_PASSWORD: ~
    # loader; default "http://fuseki:3030"; chart: external.fuseki
    FUSEKI_BASE_URL: ~
    # loader; default "intent"; chart: external.fuseki.dataset
    FUSEKI_DATASET: ~
    # loader; default "admin"; chart: external.fuseki.username
    FUSEKI_USERNAME: ~
    # loader; default "/ontology"
    ONTOLOGY_BASE_DIR: ~

# Loads the RAG corpus into Qdrant through the translator (compose qdrant-rag-bootstrap, profile rag-bootstrap,
# off by default as in compose). Image knowledge-graph-bootstrap (the repository name; the compose service keeps the
# old name). Helm hook Job, run after every
# install/upgrade while enabled; it waits itself for Qdrant and the translator (WAIT_TIMEOUT_SECONDS).
knowledgeGraphBootstrap:
  enabled: false
  image:
    repository: knowledge-graph-bootstrap
    tag: ""
  backoffLimit: 3
  env:
    # load-corpus.sh; default "/app/corpus/intent-knowledge-v2.json"
    CORPUS_PATH: "/app/corpus/intent-knowledge-v2.json"
    # load-corpus.sh; default "http://intent-translator:8080"; chart: http://<namePrefix>-intent-lcm:8082
    INTENT_INTERPRETER_BASE_URL: ~
    # load-corpus.sh; default "http://qdrant:6333"; chart: external.qdrant (HTTP)
    QDRANT_BASE_URL: ~
    # load-corpus.sh; default "/collections"
    QDRANT_READY_ENDPOINT: "/collections"
    # load-corpus.sh; default "/v2/rag/index"
    RAG_INDEX_ENDPOINT: "/v2/rag/index"
    # load-corpus.sh; default "3"
    WAIT_SLEEP_SECONDS: "3"
    # load-corpus.sh; default "180"
    WAIT_TIMEOUT_SECONDS: "180"

# Mocks of the systems InNet and InOrch drive, the images of intend/docker-compose-v3-mock.yaml. Off by default; the
# profile values-innet-inorch-mocks.yaml turns all three on and points external.* and the agents at them:
# - nsmf-mock: the NSMF for slices (InNet), through 3gpp-nsmf-agent;
# - soccer-mock: SOCCER for deployments (InOrch), through soccer-agent;
# - clg-mock: the closed-loop governance (both), through intent-lcm (cl-governance.driver rest).
# Each gets a Deployment and a Service of the same name (no prefix). State is in memory: a pod restart forgets everything.
mocks:
  nsmf:                             # ../nsmf-mock; already knows nst-ec21-001, so no onboarding is needed
    enabled: false
    image:
      repository: nsmf-mock
      tag: intend-munich-2026
    port: 9091
    resources: {}
    env:
      # the catalogue in the real NSMF format, {"nst": {...}}, as 3gpp-nsmf-agent reads it (compose v3-mock)
      NST_CATALOGUE_FORMAT: "nst-info"
  soccer:                           # ../soccer-mock; accepts descriptors aaaaaaaa-..., bbbbbbbb-... and EXTRA_DESCRIPTOR_IDS
    enabled: false
    image:
      repository: soccer-mock
      tag: intend-munich-2026
    port: 9090
    resources: {}
    env:
      # the vLLM suite descriptor (compose v3-mock SOCCER_MOCK_DESCRIPTOR_IDS)
      EXTRA_DESCRIPTOR_IDS: "c6fbdc7d-66a7-4521-afb8-5470c4e4b6d8"
  clg:                              # ../clg-mock; closed-loop lifecycle, events, a fake Kubernetes API for pod logs
    enabled: false
    image:
      repository: clg-mock
      tag: intend-munich-2026
    port: 8080
    resources: {}
    env:
      # emulated 5G and vLLM closed loops (compose v3-mock); see the clg-mock README for every SIM_* variable
      SIM_ENABLED: "true"
      SIM_OBSERVATION_SECONDS: "15"
      SIM_5G_DECISION_SECONDS: "30"
      SIM_VLLM_POLL_SECONDS: "5"
    # The application closed loop the deployment translator provisions on clg-mock (InOrch): ConfigMap
    # clg-mock-application-profile, mounted in intent-lcm at /app/mock/application-closed-loop-profile.json. Same
    # content as intend/runtime/mock/application-closed-loop-profile.json. {} = no ConfigMap.
    applicationClosedLoopProfile:
      closedLoopDescriptorId: "1035f45d-0cfc-4511-bdb6-b108fa59319b"
      configParams:
        a991ca71-0000-4000-8000-0000000000f1.target: "clg-mock"
      objectives:
        compute_latency:
          param: "a991ca71-0000-4000-8000-0000000000f1.computeLatencySetpoint"
