# Intent Manager chart: the components of intent-manager-multirepo and their data services.
# Defaults reproduce intend/docker-compose-v3.yaml. PostgreSQL, Fuseki, Qdrant and Kafka are deployed too; the systems the
# agents call (NSMF, SOCCER, CLG) are external: point to them under "external".
#
# Environment variables: every component has an "env" map listing EVERY variable it reads, with the code
# default in the comment above it.
#   ~ (null)       not set: the application uses its own default (or, where the comment says "chart:", the
#                  value the chart computes from "external", the topics or the Secret)
#   "value"        set to this value (the values already set are the ones compose v3 sets)
# Change a value here or with -f / --set, e.g. --set intentLcm.env.LOG_LEVEL_IT_NEXTWORKS=INFO.
# "extraEnv" adds anything else (list of {name, value} or {name, valueFrom}).
# Full table: CONFIGURATION.md.

global:
  # Prefix of the application components: "<namePrefix>-<component>", e.g. innet-and-inorch-intent-lcm (LCM,
  # operation-management, GUI, agents, knowledge graph Job). Data services (StatefulSets) and mocks keep the compose
  # names. "" = no prefix. Lower-case letters, digits and '-', at most 30 characters.
  namePrefix: innet-and-inorch
  imageRegistry: rd-registry.nextworks.it:443
  # Release tag of every Intent Manager image (and of the mocks below): the images tested together on 2026-11-17,
  # the same digests as master at that date. "master" = whatever master is now.
  imageTag: intend-munich-2026      # used by every component that does not set image.tag
  imagePullPolicy: IfNotPresent
  imagePullSecrets: [{name: innet-inorch-secrets-image-pull}]              # e.g. [{name: rd-registry}], created by hand (see README)
  hostAliases: []                   # compose extra_hosts, e.g. [{ip: 10.30.8.178, hostnames: [10.10.0.224.nip.io]}]
  waitImage: busybox:1.37           # init containers that wait for a TCP port (compose depends_on)
  clusterDomain: cluster.local      # used to build the full Service names the GUI's nginx resolves
  nodeSelector: {}                  # every pod, e.g. {kubernetes.io/hostname: node-2}
  tolerations: []

# Where the components find the data services and the systems the agents call. An empty host (or URL) means the
# Service this chart deploys, with its prefixed name (postgres, fuseki, qdrant, kafka and the mocks below): set
# one only to use a service deployed elsewhere.
external:
  postgres:
    host: "postgres.postgres.svc.cluster.local"                        # "" = intent-manager-postgres (deployed here)
    port: 5432
    database: json_intents_v2
    username: innet              # password: secrets.postgresPassword
  fuseki:
    host: "fuseki.fuseki.svc.cluster.local"                        # "" = fuseki (deployed here)
    port: 3030
    dataset: intent
    username: admin                 # password: secrets.fusekiAdminPassword
  qdrant:
    host: ""                        # "" = qdrant (deployed here)
    httpPort: 6333
    grpcPort: 6334
    collection: intent-knowledge
  kafka:
    bootstrapServers: ""            # "" = <host>:<port>
    host: ""                        # host and port the init containers wait for; "" = kafka (deployed here)
    port: 9092
  nsmf:
    baseUrl: http://nsmf-local:8080 # "" = the nsmf mock of this chart (mocks.nsmf.enabled)
  soccer:
    baseUrl: http://10.30.8.139:30000 # "" = the soccer mock of this chart (mocks.soccer.enabled)
    tenantId: admin
  clg:
    governanceUrl: http://10.30.8.139:30000/api/v1/ # "" = the clg mock of this chart (mocks.clg.enabled)

# Kafka topics shared by operation-management and the agents.
topics:
  task: tasks
  response: responses

# Credentials. Either name an existing Secret with the keys below, or set the values in a values.secret.yaml
# that is never committed (template: values.secret.example.yaml) and the chart creates the Secret.
#   POSTGRES_PASSWORD  FUSEKI_ADMIN_PASSWORD  OPENAI_API_KEY
secrets:
  existingSecret: "innet-inorch-secrets"  # name of an existing Secret with the keys below; "" = create a new Secret
  postgresPassword: ""              # required when existingSecret is empty
  fusekiAdminPassword: ""           # required when existingSecret is empty
  openaiApiKey: ""

# Data services, deployed with the Intent Manager (compose v3 images and settings). Turn one off to use an
# existing service instead, and point external.* to it. PVCs are kept on helm uninstall (delete them by hand).
# storageClass "" = the cluster default.
postgres:                           # Service intent-manager-postgres
  enabled: false
  image: postgres:16.14@sha256:4eb532412200f7fbbf15d62ee0d96e020a9eae9eaed76066692474a7371c4d83
  storage: {size: 2Gi, storageClass: ""}
  resources: {}
  env:
    # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD come from external.postgres and the Secret
    # data in a subfolder of the volume, so initdb also works on volumes with lost+found
    PGDATA: /var/lib/postgresql/data/pgdata

fuseki:                             # Service fuseki
  enabled: false
  image: stain/jena-fuseki:5.1.0@sha256:b1d0c96f19adddef417520184471ac816cf36c6e72936a88ea02b29f4305929a
  storage: {size: 2Gi, storageClass: ""}
  resources: {}
  env: {}                           # ADMIN_PASSWORD comes from the Secret (FUSEKI_ADMIN_PASSWORD)

qdrant:                             # Service qdrant (HTTP 6333, gRPC 6334)
  enabled: true
  image: qdrant/qdrant:v1.13.2
  storage: {size: 2Gi, storageClass: ""}
  resources: {}
  env: {}

kafka:                              # Services kafka and zookeeper, no volumes (as in compose)
  enabled: true
  image: rd-registry.nextworks.it/odin-cp-kafka@sha256:9a1e3179fba2a4460964d2848c3f61bf9952db9efa023531fd1d8b4dca9787ef
  resources: {}
  env:
    KAFKA_LISTENERS: INSIDE://0.0.0.0:9092
    KAFKA_ADVERTISED_LISTENERS: ~     # chart: INSIDE://kafka:9092
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
    KAFKA_BROKER_ID: "1"
    KAFKA_ZOOKEEPER_CONNECT: ~        # chart: zookeeper:2181
  zookeeper:
    image: confluentinc/cp-zookeeper@sha256:3553fda4b3f0cc6fa70cc5be65d0e6c9b1e5258a6fd0ca343aa9821be4973776
    resources: {}
    env:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"

# intent-lcm: one container, two JVMs. "env" = the LCM (and the start script); "translatorEnv" = the
# translator, WITHOUT the INTERPRETER_ prefix (the chart adds it: translatorEnv.QDRANT_HOST becomes
# INTERPRETER_QDRANT_HOST, which the start script passes to the translator as QDRANT_HOST).
intentLcm:
  enabled: true
  image:
    repository: intent-lcm
    tag: ""
  replicas: 1
  resources: {}
  env:
    # not read by the code (from compose); default none
    BACKEND_ENV: "production"
    # cl-governance.driver; default "rest"
    CL_GOVERNANCE_DRIVER: "dummy"
    # cl-governance.slicer-uri (@Value); default "http://3gpp-nsmf/api/v1/"
    CL_GOVERNANCE_SLICER_URI: ~
    # cl-governance.url; default "{{CL_GOVERNANCE_URL}}"; chart: external.clg.governanceUrl
    CL_GOVERNANCE_URL: ~
    # tmf.instance-prefix; default "{{INSTANCE_PREFIX}}"; chart: http://<namePrefix>-intent-lcm:8080/tmf-api/intentManagement/v5/intent/
    INSTANCE_PREFIX: ~
    # intent-lcm.autostart; default "true"
    INTENT_LCM_AUTOSTART: "true"
    # intent.report.knowledge-graph-upload.enabled; default "false"
    INTENT_REPORT_KNOWLEDGE_GRAPH_UPLOAD_ENABLED: "false"
    # intent.report.refresh.expiring-within-seconds; default "30"
    INTENT_REPORT_REFRESH_EXPIRING_WITHIN_SECONDS: ~
    # intent.report.refresh.poller-delay-ms; default "15000"
    INTENT_REPORT_REFRESH_POLLER_DELAY_MS: ~
    # intent.report.validity-minutes; default "10"
    INTENT_REPORT_VALIDITY_MINUTES: ~
    # start script: JVM options of the LCM; default empty
    JAVA_OPTS: ~
    # logging.level.it.nextworks; default "DEBUG"
    LOG_LEVEL_IT_NEXTWORKS: ~
    # openapi.intentManagement.base-path (@Value); default "/tmf-api/intentManagement/v5"
    OPENAPI_INTENTMANAGEMENT_BASE_PATH: ~
    # operation-management.driver; default "rest"
    OPERATION_MANAGEMENT_DRIVER: ~
    # operation-management.dummy-delay-ms; default "1000"
    OPERATION_MANAGEMENT_DUMMY_DELAY_MS: ~
    # operation-management.notification-url; default "${OPERATION_MANAGER_NOTIFICATION_URL:${WORKFLOW_NOTIFICATION_URL:http://intent-lcm-backend:8080/api/notifications}}"; chart: http://<namePrefix>-intent-lcm:8080/api/notifications
