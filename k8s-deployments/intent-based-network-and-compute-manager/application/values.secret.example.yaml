# Copy to values.secret.yaml (ignored by git), fill in, and pass it with -f. Never commit the real file.
# Alternatively create the Secret yourself and set secrets.existingSecret (keys listed in values.yaml).
secrets:
  postgresPassword: "<password of external.postgres.username>"
  fusekiAdminPassword: "<Fuseki admin password>"
  openaiApiKey: "<OpenAI API key, empty if the translator runs without it>"
