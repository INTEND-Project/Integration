{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "im.secretName" . }}
  labels:
    {{- include "im.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword (or secrets.existingSecret) is required" .Values.secrets.postgresPassword | quote }}
  FUSEKI_ADMIN_PASSWORD: {{ required "secrets.fusekiAdminPassword (or secrets.existingSecret) is required" .Values.secrets.fusekiAdminPassword | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
{{- end }}
