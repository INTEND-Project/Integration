apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "im.secretName" . }}
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: innet-inorch
  refreshAfter: 60s

  destination:
    create: true
    name: {{ include "im.secretName" . }}
    type: Opaque
    transformation:
      excludes:
        - IMAGE_PULL_SECRET

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "im.secretName" . }}-image-pull
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: innet-inorch
  refreshAfter: 60s

  destination:
    create: true
    name: {{ include "im.secretName" . }}-image-pull
    type: kubernetes.io/dockerconfigjson  

    transformation:
      excludes:
        - ".*"

      templates:
        .dockerconfigjson:
          text: |
            {{ get .Secrets "IMAGE_PULL_SECRET" }}
    