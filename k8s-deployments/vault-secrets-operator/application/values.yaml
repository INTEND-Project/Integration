vault-secrets-operator:  

  controller:
    replicas: 1
    
  defaultVaultConnection:
    enabled: true
    address: "http://vault.vault.svc.cluster.local:8200"
    skipTLSVerify: false

  defaultAuthMethod:
    enabled: true
    method: kubernetes
    mount: kubernetes
    kubernetes:
      role: "vso-role"
      serviceAccount: "default"
    