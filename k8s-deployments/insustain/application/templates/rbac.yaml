{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "insustain.serviceAccountName" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
{{- if .Values.rbac.clusterWide }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s-pod-reader" .Release.Namespace .Release.Name | quote }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-pod-reader" .Release.Namespace .Release.Name | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "insustain.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s-pod-reader" .Release.Namespace .Release.Name | quote }}
{{- else }}
{{- $root := . }}
{{- range prepend .Values.rbac.targetNamespaces .Release.Namespace | uniq }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-%s-pod-reader" $root.Release.Namespace $root.Release.Name | quote }}
  namespace: {{ . | quote }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-%s-pod-reader" $root.Release.Namespace $root.Release.Name | quote }}
  namespace: {{ . | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "insustain.serviceAccountName" $root | quote }}
    namespace: {{ $root.Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-%s-pod-reader" $root.Release.Namespace $root.Release.Name | quote }}
{{- end }}
{{- end }}
{{- end }}
