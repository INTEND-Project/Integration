
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: intent-manager
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: intent-manager
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intent-manager
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:      
      containers:
        - name: intent-manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: ANALYTICS_ENV
              value: {{ .Values.env.ANALYTICS_ENV | quote }}
            - name: KNOWLEDGE_GRAPH_NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: KNOWLEDGE_GRAPH_NEO4J_USERNAME
            - name: KNOWLEDGE_GRAPH_NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: KNOWLEDGE_GRAPH_NEO4J_PASSWORD          
          volumeMounts:
            - name: config-volume
              mountPath: /app/intents/config-docker.json
              subPath: config-docker.json
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: {{ .Release.Name }}-intent-manager-config
          