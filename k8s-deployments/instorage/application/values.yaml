
replicaCount: 1

image:
  repository: ghcr.io/intend-project/instorage-intent-manager
  tag: main
  pullPolicy: Always

service:
  type: ClusterIP
  port: 5001
  targetPort: 5001

containerPort: 5001

env:
  ANALYTICS_ENV: "2"


intentManager:
  config:
    llm_info:
      provider: vllm
      config:
        model_name: ""
        model_name_pretty: ""
        endpoint: ""
    knowledge_graph:
      provider: neo4j
      config:
        url: "bolt://neo4j.neo4j.svc.cluster.local:7687"

