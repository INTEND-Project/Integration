
replicaCount: 1

image:
  repository: ghcr.io/intend-project/instorage-intent-manager
  tag: main
  pullPolicy: Always

service:
  type: ClusterIP
  port: 5001
  targetPort: 5001

containerPort: 5001

env:
  ANALYTICS_ENV: "2"


intentManager:
  config:
    port: 5001
    llm_info:
      provider: gemini
      config:
        model_name: "gemini-2.5-flash-preview-04-17"
        model_name_pretty: "Gemini 2.0 Flash"
        endpoint: "https://generativelanguage.googleapis.com/v1beta/models"
    knowledge_graph:
      provider: neo4j
      config:
        url: "bolt://neo4j.neo4j.svc.cluster.local:7687"

