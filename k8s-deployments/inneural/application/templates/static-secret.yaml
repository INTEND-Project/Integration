apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Release.Name }}-backend
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: inneural
  refreshAfter: 60s
  destination:
    create: true
    name: {{ .Release.Name }}-backend
    type: Opaque
    