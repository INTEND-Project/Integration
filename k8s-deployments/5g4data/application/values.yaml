flaskApp:
  replicaCount: 1

  image:
    repository: ghcr.io/intend-project/flask-app
    tag: main

workloadCatalog:
  replicaCount: 1

  image:
    repository: ghcr.io/intend-project/workload-catalog
    tag: main

  env:
    CHARTMUSEUM_URL: "http://chartmuseum:8080"

a2aregistry:
  api:
    replicaCount: 1

    image:
      repository: ghcr.io/intend-project/a2a-registry-backend
      tag: main   

    host: "0.0.0.0"
    port: 8000
    reload: "false"
    corsOrigins: '["*"]'
    posthogEnabled: "false"
    healthCheck:
      intervalSeconds: 300
      timeoutSeconds: 10

  worker:
    replicaCount: 1

    image:
      repository: ghcr.io/intend-project/a2a-registry-backend
      tag: main

    healthCheck:
      intervalSeconds: 300
      timeoutSeconds: 10
  
  frontend:
    replicaCount: 1

    image:
      repository: ghcr.io/intend-project/a2a-registry-website
      tag: main

    apiUrl: "http://a2a-registry-api:8000"

simulatorAgentKernel:
  replicaCount: 1

  image:
    repository: ghcr.io/intend-project/simulator-agent-kernel
    tag: main

  apiServer:
    enabled: true
    host: "0.0.0.0"
    port: 3011

  workloadCatalog:
    baseUrl: "http://chartmuseum:8080"

  ontology:
    root: ""
    exampleIntentsRoot: ""

  graphdb:
    username: ""
    baseUrl: "http://graphdb.default.svc.cluster.local:7200/"
    repositoryId: "intents_and_intent_reports"
    infraRepositoryId: "telenor-infrastructure-5g4data"
    infraNamedGraph: "http://intendproject.eu/telenor/infra"
    infraEndpoint: "http://graphdb.default.svc.cluster.local:7200/repositories/telenor-infrastructure-5g4data"
    queryLimit: "0"
    contextLimit: "10"

  mlflow:
    trackingUri: ""
    experimentName: ""
    tracingEnabled: true

