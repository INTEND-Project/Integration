apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-registry-frontend  
  labels:
    app: a2a-registry-frontend

spec:
  replicas: {{ .Values.a2a-registry.frontend.replicaCount }}

  selector:
    matchLabels:
      app: a2a-registry-frontend

  template:
    metadata:
      labels:
        app: a2a-registry-frontend
        
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.a2a-registry.frontend.image.repository }}:{{ .Values.a2a-registry.frontend.image.tag }}"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          env:
            - name: VITE_API_URL
              value: {{ .Values.a2a-registry.frontend.apiUrl | quote }}

            - name: PUBLIC_API_URL
              value: {{ .Values.a2a-registry.frontend.apiUrl | quote }}