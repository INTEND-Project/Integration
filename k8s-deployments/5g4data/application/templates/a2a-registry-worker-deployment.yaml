apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-registry-worker  
  labels:
    app: a2a-registry-worker

spec:
  replicas: {{ .Values.a2aregistry.worker.replicaCount }}

  selector:
    matchLabels:
      app: a2a-registry-worker

  template:
    metadata:
      labels:
        app: a2a-registry-worker

    spec:
      containers:
        - name: a2a-registry-worker

          image: "{{ .Values.a2aregistry.worker.image.repository }}:{{ .Values.a2aregistry.worker.image.tag }}"
          imagePullPolicy: Always

          command:
            - python
            - worker.py

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL_OVERRIDE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL            

            - name: HEALTH_CHECK_INTERVAL_SECONDS
              value: {{ .Values.a2aregistry.worker.healthCheck.intervalSeconds | quote }}

            - name: HEALTH_CHECK_TIMEOUT_SECONDS
              value: {{ .Values.a2aregistry.worker.healthCheck.timeoutSeconds | quote }}