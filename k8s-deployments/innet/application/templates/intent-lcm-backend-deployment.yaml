apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-intent-lcm-backend

  labels:
    app: {{ .Release.Name }}-intent-lcm-backend

spec:
  replicas: {{ .Values.intentLcmBackend.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Release.Name }}-intent-lcm-backend

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-intent-lcm-backend

    spec:
      {{- include "innet.imagePullSecrets" . | nindent 6 }}

      containers:
        - name: intent-lcm-backend

          image: "{{ .Values.intentLcmBackend.image.repository }}:{{ .Values.intentLcmBackend.image.tag }}"

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: OPERATION_MANAGEMENT_DRIVER
              value: {{ .Values.intentLcmBackend.OPERATION_MANAGEMENT_DRIVER | quote }}

            - name: CL_GOVERNANCE_DRIVER
              value: {{ .Values.intentLcmBackend.CL_GOVENANCE_DRIVER | quote }}