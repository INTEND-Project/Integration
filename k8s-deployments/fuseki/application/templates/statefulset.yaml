apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fuseki.fullname" . }}
  labels:
    {{- include "fuseki.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "fuseki.fullname" . }}
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "fuseki.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "fuseki.selectorLabels" . | nindent 8 }}

    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: fuseki
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 3030
              protocol: TCP

          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fuseki.secretName" . }}
                  key: {{ .Values.auth.passwordKey }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          volumeMounts:
            - name: fuseki-data
              mountPath: /fuseki

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}

      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}

      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}

  volumeClaimTemplates:
    - metadata:
        name: fuseki-data
        labels:
          {{- include "fuseki.labels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}

        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}

        resources:
          requests:
            storage: {{ .Values.persistence.size }}